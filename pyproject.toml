[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-replication"
version = "0.1.0"
description = "Testing the informed-minority claim on Polymarket trade data (R2 + DuckDB)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
    "linearmodels>=6.0",
    "pyarrow>=16.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.setuptools]
packages = ["src", "src.lib", "src.data", "src.analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
